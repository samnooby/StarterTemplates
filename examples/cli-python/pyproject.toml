[project]
name = "greet-cli"
version = "0.1.0"
description = "Minimal CLI used to exercise the test-cli harness."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
greet = "greet_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greet_cli"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13", "pyright>=1.1.405"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH", "DTZ", "ANN", "BLE", "TRY", "RUF"]
ignore = ["ANN401", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
